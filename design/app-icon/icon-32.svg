<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    32-pixel variant of icon-sequoia-1024.svg. Per the handoff's "Known approximations > Small sizes" note, with
    the adaptations that measurement showed were also needed:

      * face buttons and centre pill dropped   (spec)
      * d-pad kept, thickened 5u -> 6u          (spec, plus small-size weight)
      * knockout gap 3.1u -> 4u                 (spec; stroke-width 8.89 * 0.9 / 2)
      * glyph scaled 5.109 -> 5.85              (~15% larger mark)
      * sprockets 7 per row -> 4, larger        (7 rows render as sub-pixel noise)
      * cast shadow removed                     (a 3.4u blur is mush below 32px)
      * strip opacity 0.52 -> 0.66              (52% white does not hold at 16px)

    Container geometry, gradients and palette are unchanged, so the variants sit
    in the same iconset without a visible seam at the switch point.
  -->
  <defs>
    <linearGradient id="body" x1="0.49" y1="0" x2="0.51" y2="1">
      <stop offset="0" stop-color="#5BDDEC"></stop><stop offset="0.52" stop-color="#17A5C6"></stop><stop offset="1" stop-color="#0B7591"></stop>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.06" r="0.62">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
    </radialGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4"></rect></clipPath>

    <mask id="stripSmall" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <g transform="rotate(-8 50 50)">
        <rect x="2" y="26" width="96" height="50" rx="8" fill="#fff"></rect>
        <rect x="8" y="28.5" width="11" height="7" rx="2.5" fill="#000"></rect>
        <rect x="30" y="28.5" width="11" height="7" rx="2.5" fill="#000"></rect>
        <rect x="52" y="28.5" width="11" height="7" rx="2.5" fill="#000"></rect>
        <rect x="74" y="28.5" width="11" height="7" rx="2.5" fill="#000"></rect>
        <rect x="8" y="65.5" width="11" height="7" rx="2.5" fill="#000"></rect>
        <rect x="30" y="65.5" width="11" height="7" rx="2.5" fill="#000"></rect>
        <rect x="52" y="65.5" width="11" height="7" rx="2.5" fill="#000"></rect>
        <rect x="74" y="65.5" width="11" height="7" rx="2.5" fill="#000"></rect>
      </g>
      <g transform="translate(50 46) scale(0.9) translate(-50 -56)"><path d="M30 38H70C78 38 84 42 86 50L90 62C92 69 87 74 82 71L72 63H28L18 71C13 74 8 69 10 62L14 50C16 42 22 38 30 38Z" fill="#000" stroke="#000" stroke-width="8.89" stroke-linejoin="round"></path></g>
    </mask>

    <mask id="ctrlSmall" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <g transform="translate(50 46) scale(0.9) translate(-50 -56)"><path d="M30 38H70C78 38 84 42 86 50L90 62C92 69 87 74 82 71L72 63H28L18 71C13 74 8 69 10 62L14 50C16 42 22 38 30 38Z" fill="#fff"></path>
      <rect x="29" y="44.5" width="6" height="15" rx="1.5" fill="#000"></rect>
      <rect x="24.5" y="49" width="15" height="6" rx="1.5" fill="#000"></rect>
      </g>
    </mask>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#body)"></rect>
    <rect x="100" y="100" width="824" height="824" fill="url(#spec)"></rect>
  </g>

  <g transform="translate(219.5 219.5) scale(5.85)">
    <rect width="100" height="100" fill="#fff" opacity="0.66" mask="url(#stripSmall)"></rect>
    <rect width="100" height="100" fill="#fff" mask="url(#ctrlSmall)"></rect>
  </g>
</svg>
