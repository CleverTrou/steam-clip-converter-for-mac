<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
       background:radial-gradient(120% 140% at 0% 0%,#3B444C 0%,#22282E 55%,#161a1e 100%);color:#F2F6F8;position:relative}
  .glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;
        background:radial-gradient(circle,rgba(23,165,198,.38) 0%,rgba(23,165,198,0) 65%)}
  .copy{position:absolute;left:72px;top:76px;width:440px}
  .icon{width:132px;height:132px;display:block;margin-left:-8px}
  h1{font-size:50px;line-height:1.04;font-weight:700;letter-spacing:-.6px;margin:26px 0 18px}
  h1 span{color:#5BDDEC}
  p{font-size:22px;line-height:1.4;color:#C9D3D9;margin:0 0 30px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{font-size:16px;font-weight:600;padding:7px 14px;border-radius:999px;
        background:rgba(91,221,236,.12);color:#7FE9F7;border:1px solid rgba(91,221,236,.28)}
  .shot{position:absolute;left:560px;top:96px;width:860px;border-radius:10px;
        box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
</style></head><body>
  <div class="glow"></div>
  <img class="shot" src="rounded.png">
  <div class="copy">
    <img class="icon" src="icon.svg">
    <h1>Steam Clip Converter <span>for Mac</span></h1>
    <p>Turn Steam Game Recordings into files QuickTime, Photos and Final&nbsp;Cut open. Lossless, in about a second.</p>
    <div class="chips"><span class="chip">No ffmpeg</span><span class="chip">Apple silicon + Intel</span><span class="chip">MIT</span></div>
  </div>
</body></html>
